[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
hex = "0.4.3"
k256 = "0.14.0"
nsm-nitro-enclave-utils = "0.1.3"
rand = "0.10.3"
sha2 = "0.11.0"
shared = { path = "../shared", features = ["server"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[features]
dev = ["nsm-nitro-enclave-utils/pki"]
